name: Keep Agendaste Alive

# Le pega a la URL cada 10 minutos para que Render no duerma la app
# (el free tier de Render duerme la app tras ~15 min sin tráfico)

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch: {} # permite dispararlo a mano desde la pestaña Actions

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping agendaste.com.ar
        run: |
          echo "Pinging https://agendaste.com.ar ..."
          # -sS: silencioso pero muestra errores | -o /dev/null: descarta el body
          # -w: imprime el status code | --max-time: timeout de 30s
          # --retry 2: reintenta 2 veces si falla (útil si justo se está despertando)
          status=$(curl -sS -o /dev/null -w "%{http_code}" \
            --max-time 30 --retry 2 --retry-delay 5 \
            https://agendaste.com.ar)
          echo "Status code: $status"
          if [ "$status" -ge 200 ] && [ "$status" -lt 400 ]; then
            echo "✅ App despierta y respondiendo"
          else
            echo "⚠️  Respuesta inesperada ($status) — puede que Render esté teniendo problemas"
            exit 1
          fi

      # Manda los recordatorios de turnos pendientes (POST /api/cron/reminders).
      # El secret se configura en GitHub → Settings → Secrets and variables → Actions → CRON_SECRET
      # y tiene que ser igual a la env var CRON_SECRET de Render.
      - name: Recordatorios por mail
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$CRON_SECRET" ]; then
            echo "⚠️  Falta el secret CRON_SECRET en GitHub: no se mandan recordatorios"
            exit 0
          fi
          # Reintentar es seguro: el endpoint marca cada turno antes de mandarlo, nunca sale dos veces
          status=$(curl -sS -o response.json -w "%{http_code}" \
            --max-time 120 --retry 1 --retry-delay 10 \
            -X POST -H "x-cron-secret: $CRON_SECRET" \
            https://agendaste.com.ar/api/cron/reminders)
          echo "Status code: $status"
          cat response.json; echo
          if [ "$status" -lt 200 ] || [ "$status" -ge 300 ]; then
            echo "⚠️  Falló el envío de recordatorios ($status)"
            exit 1
          fi
