<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BarberApp — Registrá tu negocio</title>
  <link rel="stylesheet" href="/css/styles.css">
  <style>
    .register-card { max-width: 420px; margin: 2rem auto; }
    .register-header { text-align: center; padding: 1.5rem 0 1rem; }
    .register-header h2 { margin-bottom: .5rem; }
    .register-header p { color: var(--text-muted); font-size: 14px; }
    .section-label { font-family: var(--font-mono); font-size: 11px; color: var(--text-muted); font-weight: 500; text-transform: uppercase; letter-spacing: .18em; margin: 1.25rem 0 .75rem; }
    .slug-row { display: flex; align-items: center; gap: 6px; background: var(--bg-secondary); border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 8px 12px; }
    .slug-base { font-size: 13px; color: var(--text-muted); white-space: nowrap; }
    .slug-value { font-size: 13px; color: var(--green); font-weight: 600; }
  </style>
</head>
<body>

<nav class="navbar">
  <a href="/" class="navbar-brand"><span class="brand-mark">A</span> Agendaste</a>
</nav>

<div class="container">
  <div class="register-card">

    <div class="register-header">
      <div style="font-size:44px;margin-bottom:.75rem">✂️</div>
      <h2>Registrá tu negocio</h2>
      <p>Completá los datos para crear tu barbería en BarberApp</p>
    </div>

    <div class="card" style="padding:1.5rem">

      <p class="section-label">Tus datos</p>
      <div class="form-group">
        <label>Tu nombre completo</label>
        <input type="text" id="inp-owner-name" placeholder="Ej: Martín García" oninput="checkForm()">
      </div>
      <div class="form-group">
        <label>Email (el mismo de Google)</label>
        <input type="email" id="inp-email" placeholder="tu@email.com" oninput="checkForm()">
      </div>

      <p class="section-label">Tu negocio</p>
      <div class="form-group">
        <label>Nombre de la barbería</label>
        <input type="text" id="inp-biz-name" placeholder="Ej: Barber House" oninput="updateSlug(); checkForm()">
      </div>
      <div class="form-group">
        <label>Dirección</label>
        <input type="text" id="inp-address" placeholder="Ej: Av. Corrientes 1234, CABA">
      </div>
      <div class="form-group">
        <label>Teléfono</label>
        <input type="tel" id="inp-phone" placeholder="Ej: +54 9 11 1234-5678">
      </div>
      <div class="form-group">
        <label>Tu URL en BarberApp</label>
        <div class="slug-row">
          <span class="slug-base">barberapp.com/</span>
          <span class="slug-value" id="slug-preview">—</span>
        </div>
      </div>

      <button class="btn btn-primary" id="btn-register" style="width:100%;margin-top:.75rem" disabled onclick="doRegister()">
        Crear negocio →
      </button>

    </div>
  </div>
</div>

<div id="toast"></div>

<script>
  // Pre-rellenar email si viene del flujo de Google OAuth
  const params = new URLSearchParams(window.location.search);
  if (params.get('email')) {
    document.getElementById('inp-email').value = params.get('email');
    checkForm();
  }

  function toSlug(str) {
    return str
      .toLowerCase()
      .normalize('NFD').replace(/[̀-ͯ]/g, '')
      .replace(/[^a-z0-9\s]/g, '')
      .trim()
      .replace(/\s+/g, '-');
  }

  function updateSlug() {
    const name = document.getElementById('inp-biz-name').value;
    document.getElementById('slug-preview').textContent = name ? toSlug(name) : '—';
  }

  function checkForm() {
    const ok = document.getElementById('inp-owner-name').value.trim() &&
               document.getElementById('inp-email').value.trim() &&
               document.getElementById('inp-biz-name').value.trim();
    document.getElementById('btn-register').disabled = !ok;
  }

  async function doRegister() {
    const btn = document.getElementById('btn-register');
    btn.disabled = true;
    btn.textContent = 'Creando negocio...';

    const body = {
      ownerName:    document.getElementById('inp-owner-name').value.trim(),
      email:        document.getElementById('inp-email').value.trim(),
      businessName: document.getElementById('inp-biz-name').value.trim(),
      address:      document.getElementById('inp-address').value.trim(),
      phone:        document.getElementById('inp-phone').value.trim()
    };

    try {
      const res  = await fetch('/api/register', {
        method:  'POST',
        headers: { 'Content-Type': 'application/json' },
        body:    JSON.stringify(body)
      });
      const data = await res.json();

      if (!res.ok) {
        showToast('❌ ' + data.error);
        btn.disabled = false;
        btn.textContent = 'Crear negocio →';
        return;
      }

      showToast('✅ ¡Negocio creado!');
      setTimeout(() => window.location.href = '/admin', 1500);
    } catch {
      showToast('❌ Error de conexión');
      btn.disabled = false;
      btn.textContent = 'Crear negocio →';
    }
  }

  function showToast(msg) {
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.classList.add('show');
    setTimeout(() => t.classList.remove('show'), 3000);
  }
</script>
</body>
</html>
